name: Documentation Validation

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "README.md"
      - "docs/**"
      - "mkdocs.yml"
      - ".markdownlint.json"
      - ".lychee.toml"
      - "requirements-docs.txt"
      - ".github/workflows/documentation-*.yml"
  push:
    branches: ["main"]
    paths:
      - "README.md"
      - "docs/**"
      - "mkdocs.yml"
      - ".markdownlint.json"
      - ".lychee.toml"
      - "requirements-docs.txt"
      - ".github/workflows/documentation-*.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install validation tools
        run: |
          npm install --global markdownlint-cli@0.41.0
          python -m pip install --upgrade pip
          python -m pip install -r requirements-docs.txt

      - name: Markdownlint
        id: markdownlint
        run: markdownlint --config .markdownlint.json "README.md" "docs/**/*.md"

      - name: Lychee link check
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config .lychee.toml --no-progress "README.md" "docs/**/*.md"
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build MkDocs site
        id: mkdocs
        run: mkdocs build --strict --site-dir site-preview

      - name: Report status
        if: always()
        run: |
          {
            echo "## Documentation validation"
            echo ""
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| Markdownlint | ${{ steps.markdownlint.outcome }} |"
            echo "| Lychee | ${{ steps.lychee.outcome }} |"
            echo "| MkDocs build | ${{ steps.mkdocs.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"
